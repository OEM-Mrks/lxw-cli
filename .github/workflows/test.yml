name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Aus uv.lock, nicht frei aufgelöst: sonst testet CI andere
        # Abhängigkeitsversionen als die, die ausgeliefert werden — genau so
        # rutschte unbemerkt fastmcp 4.0 in den Testlauf, während das Lockfile
        # auf 3.4.4 stand. --locked bricht ab, wenn uv.lock nicht zu
        # pyproject.toml passt (statt es stillschweigend zu aktualisieren).
        run: uv sync --extra dev --locked --python ${{ matrix.python-version }}

      # --extra dev bei jedem Aufruf, sonst re-synct `uv run` die Umgebung auf
      # die Standard-Extras und wirft ruff/pytest wieder heraus.
      - name: Ruff
        run: uv run --extra dev --locked ruff check src tests

      - name: Pytest
        run: uv run --extra dev --locked pytest -v
