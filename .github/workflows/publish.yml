name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  # Manueller Start (Actions → "Publish to PyPI" → Run workflow) für den Fall,
  # dass kein Tag gepusht werden kann: legt den Tag v<version> aus
  # pyproject.toml auf dem gewählten Commit an und veröffentlicht dann.
  workflow_dispatch:

# Standard ohne Rechte; Jobs fordern nur an, was sie brauchen. Actions sind
# auf Commit-SHAs gepinnt (Kommentar = Version), weil der Publish-Job ein
# OIDC-Token für PyPI bekommt — ein verschobener Tag darf da nicht rankommen.
permissions: {}

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag v<version> anlegen
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          tag="v${version}"
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            if [ "$(git rev-parse "${tag}^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::${tag} existiert bereits auf einem anderen Commit."
              exit 1
            fi
            echo "${tag} existiert bereits auf diesem Commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${tag}"
          # Mit GITHUB_TOKEN gepushte Tags starten keinen weiteren Workflow —
          # veröffentlicht wird daher in genau diesem Lauf.
          git push origin "${tag}"

  build:
    needs: tag
    # Läuft auch beim Tag-Push, wo der tag-Job übersprungen wird.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Build sdist + wheel
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Explizit, sonst übersprungen, wenn der tag-Job beim Tag-Push entfällt.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted Publishing: kein API-Token nötig — auf pypi.org unter
    # "Publishing" diesen Repo/Workflow als Trusted Publisher eintragen.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
